<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" version="1.1">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Badge Amber Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Batch Layer Blue Gradient -->
    <linearGradient id="batchLayerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Arc Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background Card -->
  <rect x="2" y="2" width="92" height="92" rx="18" ry="18" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- 2. Grid & CAD Guide Lines -->
  <line x1="20" y1="12" x2="20" y2="76" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" stroke-opacity="0.4" />
  <line x1="12" y1="20" x2="84" y2="20" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" stroke-opacity="0.4" />

  <!-- 3. STACKED BATCH LAYER (Background Geometry) -->
  <path d="M 28 68 L 28 34 Q 28 26 36 26 L 76 26" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.4" />
  <polyline points="28,52 46,26" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4" />
  <circle cx="28" cy="34" r="2.5" fill="#60a5fa" fill-opacity="0.5" />
  <circle cx="36" cy="26" r="2.5" fill="#60a5fa" fill-opacity="0.5" />

  <!-- 4. PRIMARY FOREGROUND GEOMETRY (Fillet + Chamfer) -->
  <!-- Original Sharp Vertex (dashed) -->
  <polyline points="20,68 20,20 68,20" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3 3" stroke-linecap="round" />
  <!-- Corner apex indicator -->
  <circle cx="20" cy="20" r="3.2" fill="#ef4444" stroke="#ffffff" stroke-width="1.2" />

  <!-- FILLET: Smooth Curve Arc (Sky Blue) -->
  <path d="M 20 68 L 20 46 Q 20 20 46 20 L 72 20" fill="none" stroke="#38bdf8" stroke-width="4.2" stroke-linecap="round" filter="url(#glow)" />
  <!-- Fillet Tangent Points -->
  <circle cx="20" cy="46" r="3" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2" />
  <circle cx="46" cy="20" r="3" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2" />

  <!-- CHAMFER: Beveled Corner Line (Emerald Green) -->
  <line x1="20" y1="36" x2="36" y2="20" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
  <circle cx="20" cy="36" r="2.5" fill="#34d399" stroke="#ffffff" stroke-width="1" />
  <circle cx="36" cy="20" r="2.5" fill="#34d399" stroke="#ffffff" stroke-width="1" />

  <!-- 5. COMPATIBILITY & BATCH BADGE -->
  <!-- Badge Container Pill -->
  <rect x="22" y="68" width="68" height="20" rx="6" ry="6" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="1.2" />

  <!-- Text inside Badge: "3.x & 4.x" -->
  <text x="56" y="82.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">3.x &amp; 4.x</text>

  <!-- Small "BATCH" Tag / Pill in top right -->
  <rect x="52" y="32" width="36" height="15" rx="4" ry="4" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" />
  <text x="70" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="0.8">BATCH</text>
</svg>
