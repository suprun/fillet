<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Fillet Glow/Stroke Gradient -->
    <linearGradient id="filletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Chamfer Stroke Gradient -->
    <linearGradient id="chamferGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="3" y="3" width="90" height="90" rx="18" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Grid CAD Guides -->
  <line x1="20" y1="20" x2="20" y2="76" stroke="#334155" stroke-width="1" stroke-dasharray="2,2" opacity="0.4" />
  <line x1="20" y1="20" x2="76" y2="20" stroke="#334155" stroke-width="1" stroke-dasharray="2,2" opacity="0.4" />

  <!-- Original Corner Outline (Dashed) -->
  <path d="M 18,74 L 18,18 L 74,18" fill="none" stroke="#64748B" stroke-width="2.5" stroke-dasharray="4,3" stroke-linecap="round" />

  <!-- Chamfer Bevel Line (Emerald Green) -->
  <line x1="18" y1="46" x2="46" y2="18" stroke="url(#chamferGrad)" stroke-width="3" stroke-linecap="round" opacity="0.85" />

  <!-- Fillet Smooth Arc (Electric Blue) -->
  <!-- Arc from (18, 62) to (62, 18) with radius 44 -->
  <path d="M 18,74 L 18,60 A 42,42 0 0,1 60,18 L 74,18" fill="none" stroke="url(#filletGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />

  <!-- Tangent & Vertex Markers -->
  <circle cx="18" cy="18" r="3.5" fill="#EF4444" stroke="#FFFFFF" stroke-width="1" />
  <circle cx="18" cy="60" r="3" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1" />
  <circle cx="60" cy="18" r="3" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1" />
  <circle cx="18" cy="46" r="2.5" fill="#34D399" />
  <circle cx="46" cy="18" r="2.5" fill="#34D399" />

  <!-- "3.x" Version Badge (Bottom-Right) -->
  <g transform="translate(44, 52)" filter="url(#shadow)">
    <rect x="0" y="0" width="46" height="34" rx="8" fill="url(#badgeGrad)" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="23" y="24" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="-0.5">3.x</text>
  </g>
</svg>
