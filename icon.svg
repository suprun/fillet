<?xml version="1.0" encoding="UTF-8"?>
<svg height="64" viewBox="0 0 24 24" width="64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Drop Shadow Filter for Badge -->
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.3" dy="0.6" stdDeviation="0.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Standard QGIS Advanced Digitizing (cadtools/cad.svg) base -->
  <g id="qgis_cad_base" transform="translate(0 -8)">
    <g fill="#ffee7f" fill-rule="evenodd">
      <path d="m-30.5-22.5h21v6h-21z" stroke="#80752a" stroke-linecap="square" transform="matrix(0 -1 -1 0 0 0)"/>
      <path d="m22 27.5h-2" stroke="#b8a93d"/>
      <path d="m22 24.5h-3" stroke="#b8a93d"/>
      <path d="m22 21.5h-2" stroke="#b8a93d"/>
      <path d="m22 18.5h-3" stroke="#b8a93d"/>
      <path d="m22 15.5h-2" stroke="#b8a93d"/>
      <path d="m22 12.5h-3" stroke="#b8a93d"/>
    </g>
    <path d="m.5.5v23h23zm5 12 6 6h-6z" fill="#ffa067" stroke="#9f6440" stroke-linejoin="round" transform="translate(0 8)"/>
    <path d="m1.5 31.5v-22" fill="none" stroke="#ffb98f"/>
    <path d="m11 26 1.5 1.5h-6l-1-1" fill="none" stroke="#ffb98f" stroke-linejoin="round"/>
    <path d="m.5 8.5000003v22.9999997h23zm5 11.9999997 6 6h-6z" fill="none" stroke="#674029" stroke-linejoin="round"/>
  </g>

  <!-- PRO Badge with Rubik font and generous padding -->
  <g id="pro_badge" filter="url(#badgeShadow)">
    <!-- Badge Background Pill with generous padding -->
    <rect x="8.5" y="0.4" width="15.1" height="8.4" rx="2.4" ry="2.4" 
          fill="#1d4ed8" stroke="#ffffff" stroke-width="0.75" stroke-linejoin="round"/>
    
    <!-- Text PRO in Rubik Bold with balanced spacing -->
    <text x="16.05" y="6.15" 
          font-family="Rubik, 'Segoe UI', Roboto, sans-serif" 
          font-size="4.5" 
          font-weight="800" 
          letter-spacing="0.4" 
          text-anchor="middle" 
          fill="#ffffff">PRO</text>
  </g>
</svg>
