<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   height="24"
   viewBox="0 0 24 24"
   width="24"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <!-- Original smaller geometry polygon (dashed outline) -->
  <polygon
     points="3,21 11,21 11,13 3,13"
     style="fill:#8cbe8c;fill-opacity:0.35;stroke:#555753;stroke-width:1;stroke-dasharray:1.5,1.5" />

  <!-- Scaled and rotated larger geometry polygon -->
  <polygon
     points="3,21 19,17 15,2 1,7"
     style="fill:#8cbe8c;fill-opacity:0.85;stroke:#10b981;stroke-width:1.5" />

  <!-- Scale & Rotate transformation arc arrow -->
  <path
     d="M 12,12 A 8,8 0 0 1 19,10"
     style="fill:none;stroke:#ea580c;stroke-width:1.8;stroke-linecap:round" />
  <polygon
     points="18,7 22,10 18,12"
     style="fill:#ea580c;stroke:#ea580c;stroke-width:0.5;stroke-linejoin:round" />

  <!-- Diagonal scaling arrow -->
  <path
     d="M 11,13 L 15,3"
     style="fill:none;stroke:#3b82f6;stroke-width:1.4;stroke-dasharray:2,1" />

  <!-- Pivot Center Crosshair Anchor Point -->
  <circle
     cx="3"
     cy="21"
     r="3"
     style="fill:#ea580c;fill-opacity:0.9;stroke:#ffffff;stroke-width:1" />
  <circle
     cx="3"
     cy="21"
     r="1"
     style="fill:#ffffff" />
</svg>
