<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   height="24"
   viewBox="0 0 24 24"
   width="24"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <!-- Line 1 (horizontal from left) -->
  <path
     d="M 2,6 L 12,6"
     fill="none"
     stroke="#2563eb"
     stroke-width="2.5"
     stroke-linecap="round" />
  <!-- Line 2 (vertical to bottom) -->
  <path
     d="M 18,12 L 18,22"
     fill="none"
     stroke="#2563eb"
     stroke-width="2.5"
     stroke-linecap="round" />
  <!-- Fillet Arc joining Line 1 and Line 2 -->
  <path
     d="M 12,6 Q 18,6 18,12"
     fill="none"
     stroke="#10b981"
     stroke-width="2.5"
     stroke-linecap="round" />
  <!-- Corner extension dashed lines -->
  <path
     d="M 12,6 L 18,6 L 18,12"
     fill="none"
     stroke="#9ca3af"
     stroke-width="1"
     stroke-dasharray="2,2" />
  <!-- Center join node -->
  <circle
     cx="18"
     cy="6"
     r="1.5"
     fill="#ea580c" />
  <!-- Small merge badge -->
  <circle
     cx="7"
     cy="17"
     r="5"
     fill="#10b981" />
  <path
     d="M 7,14.5 L 7,19.5 M 4.5,17 L 9.5,17"
     stroke="#ffffff"
     stroke-width="1.5"
     stroke-linecap="round" />
</svg>
