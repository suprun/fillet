<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   height="24"
   viewBox="0 0 24 24"
   width="24"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <!-- Original shape on the left -->
  <polygon
     points="2,19 10,19 9,7 3,11"
     style="fill:#8cbe8c;fill-opacity:0.4;stroke:#555753;stroke-width:1;stroke-dasharray:1.5,1.5" />

  <!-- Mirrored shape on the right -->
  <polygon
     points="22,19 14,19 15,7 21,11"
     style="fill:#8cbe8c;fill-opacity:0.85;stroke:#204a87;stroke-width:1.5" />

  <!-- Central Mirror Symmetry Axis Line -->
  <line
     x1="12"
     y1="2"
     x2="12"
     y2="22"
     style="stroke:#ce5c00;stroke-width:1.6;stroke-dasharray:2.5,1.5;stroke-linecap:round" />

  <!-- Axis Anchor Points (P1 and P2) -->
  <circle
     cx="12"
     cy="3"
     r="2"
     style="fill:#ea580c;stroke:#ffffff;stroke-width:0.8" />
  <circle
     cx="12"
     cy="21"
     r="2"
     style="fill:#ea580c;stroke:#ffffff;stroke-width:0.8" />

  <!-- Bidirectional reflection arrows -->
  <path
     d="M 6,5 L 8,5 M 16,5 L 18,5"
     style="stroke:#ce5c00;stroke-width:1.2;stroke-linecap:round" />
</svg>
