<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   height="24"
   viewBox="0 0 24 24"
   width="24"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <!-- Original polygon shape outline (dashed) -->
  <polygon
     points="3,20 14,20 14,7 3,7"
     style="fill:#8cbe8c;fill-opacity:0.3;stroke:#555753;stroke-width:1;stroke-dasharray:1.5,1.5" />

  <!-- Extended polygon with shifted edge -->
  <polygon
     points="3,20 20,20 20,7 3,7"
     style="fill:#8cbe8c;fill-opacity:0.8;stroke:#10b981;stroke-width:1.4" />

  <!-- Parallel shifted active edge -->
  <line
     x1="20"
     y1="7"
     x2="20"
     y2="20"
     style="stroke:#2563eb;stroke-width:2.2;stroke-linecap:round" />

  <!-- Shift / Offset indicator arrows -->
  <path
     d="M 13,13.5 L 18.5,13.5"
     style="fill:none;stroke:#ea580c;stroke-width:1.6;stroke-linecap:round" />
  <polygon
     points="17,11.5 20,13.5 17,15.5"
     style="fill:#ea580c;stroke:#ea580c;stroke-width:0.5;stroke-linejoin:round" />

  <!-- Endpoint dots on original edge -->
  <circle
     cx="14"
     cy="7"
     r="1.5"
     style="fill:#555753" />
  <circle
     cx="14"
     cy="20"
     r="1.5"
     style="fill:#555753" />

  <!-- Endpoint dots on shifted edge -->
  <circle
     cx="20"
     cy="7"
     r="1.8"
     style="fill:#2563eb;stroke:#ffffff;stroke-width:0.6" />
  <circle
     cx="20"
     cy="20"
     r="1.8"
     style="fill:#2563eb;stroke:#ffffff;stroke-width:0.6" />
</svg>
