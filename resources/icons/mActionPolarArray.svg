<?xml version="1.0" encoding="UTF-8"?>
<svg height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular Array Axis & Arc -->
  <circle cx="12" cy="12" r="7.5" fill="none" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="2 1.5" opacity="0.85"/>
  
  <!-- Center Pivot Cross -->
  <circle cx="12" cy="12" r="1.5" fill="#ef4444" stroke="#ffffff" stroke-width="0.6"/>
  
  <!-- Rotated Features around the circle (4 polar items at 0, 90, 180, 270 deg) -->
  <!-- Top Item (0 deg / 12 o'clock) -->
  <rect x="10.2" y="1.5" width="3.6" height="5.5" rx="0.8" fill="#f97316" stroke="#9a3412" stroke-width="0.8"/>
  
  <!-- Right Item (90 deg / 3 o'clock) -->
  <rect x="17" y="10.2" width="5.5" height="3.6" rx="0.8" fill="#fb923c" stroke="#9a3412" stroke-width="0.8"/>
  
  <!-- Bottom Item (180 deg / 6 o'clock) -->
  <rect x="10.2" y="17" width="3.6" height="5.5" rx="0.8" fill="#fb923c" stroke="#9a3412" stroke-width="0.8"/>
  
  <!-- Left Item (270 deg / 9 o'clock) -->
  <rect x="1.5" y="10.2" width="5.5" height="3.6" rx="0.8" fill="#fb923c" stroke="#9a3412" stroke-width="0.8"/>

  <!-- Directional Arc Arrow (Circular rotation guide) -->
  <path d="M 14.5 4.8 A 7.5 7.5 0 0 1 19.2 9.5" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 17.5 9.5 L 19.2 9.5 L 19.2 7.8" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
