<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   height="24"
   viewBox="0 0 24 24"
   width="24"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <!-- Polygon/polyline path -->
  <polyline
     points="3,19 12,5 21,19"
     style="fill:none;stroke:#2563eb;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" />

  <!-- Normal single vertices on base -->
  <circle
     cx="3"
     cy="19"
     r="2"
     style="fill:#1d4ed8;stroke:#ffffff;stroke-width:1" />
  <circle
     cx="21"
     cy="19"
     r="2"
     style="fill:#1d4ed8;stroke:#ffffff;stroke-width:1" />

  <!-- Duplicate vertex indication at apex: two overlapping nodes being cleaned -->
  <circle
     cx="10.5"
     cy="5"
     r="2.8"
     style="fill:#ef4444;fill-opacity:0.8;stroke:#ffffff;stroke-width:0.8" />
  <circle
     cx="13.5"
     cy="5"
     r="2.8"
     style="fill:#f97316;fill-opacity:0.8;stroke:#ffffff;stroke-width:0.8" />

  <!-- Clean / Merge action indicator: Sparkle / Clean star or Arrow -->
  <path
     d="M 12,1 L 12.8,3.2 L 15,4 L 12.8,4.8 L 12,7 L 11.2,4.8 L 9,4 L 11.2,3.2 Z"
     style="fill:#10b981;stroke:#047857;stroke-width:0.4" />

  <!-- Green Checkmark badge on bottom right -->
  <circle
     cx="17.5"
     cy="13.5"
     r="4.5"
     style="fill:#10b981;stroke:#ffffff;stroke-width:1" />
  <path
     d="M 15.5,13.5 L 17,15 L 19.5,12"
     style="fill:none;stroke:#ffffff;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round" />
</svg>
